    "search-jacket", "search-jeans", "search-membership", "search-policy", "search-pricing",
    "search-shirt", "search-timing", "select-faq", "update-order", "validate-purchase",
    "verify-identity",
]
shipping_issue = [
    "ask-the-oracle", "make-purchase", "n-a", "offer-refund", "pull-up-account", "record-reason",
    "search-boots", "search-faq", "search-jacket", "search-jeans", "search-membership",
    "search-policy", "search-pricing", "search-shirt", "search-timing", "select-faq",
    "shipping-status", "update-order", "validate-purchase", "verify-identity",
]
single_item_query = [
    "ask-the-oracle", "boots", "jacket", "jeans", "n-a", "search-boots", "search-faq",
